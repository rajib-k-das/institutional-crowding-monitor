name: crowding
version: "0.1.0"
config-version: 2
profile: crowding

model-paths: ["models"]
test-paths: ["tests/data_tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

seeds:
  crowding:
    +schema: reference
    us_federal_holidays:
      +column_types:
        holiday_date: date

models:
  crowding:
    # Labels every dbt query in Snowflake's query history (ignored on DuckDB).
    +query_tag: "crowding:dbt"
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  # Report quarters studied. The data sets start with filings made in late 2023, so Q3 2023 is the first quarter
  # whose original filings are all present; Q2 2026 is the latest quarter filed.
  first_report_quarter: "2023-09-30"
  last_report_quarter: "2026-06-30"
  # A security needs at least this many filings reporting it in a quarter for a consensus price (decision 006).
  min_filings_for_price: 5
  # Splits: managers holding a stock in both quarters must number at least this many to infer a split.
  min_managers_for_split: 3
  # Crowding analysis universe: stocks held by at least this many managers (as known at the deadline).
  min_holders_for_crowding: 10
