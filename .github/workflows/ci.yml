name: dbt build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Hand-built test filings: every awkward case has a known answer.
      - run: python ingest/load_13f.py --raw-dir tests/fixtures
      - run: dbt build
      # The dashboard's data files still build from the marts.
      - run: python scripts/export_for_tableau.py
